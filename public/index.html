<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
<!-- 告诉浏览器本站自己支持白色和深色：安卓 Chrome、三星、微信等的“强制深色”就不会再把页面涂黑；选了白色时改成只用浅色 -->
<meta name="color-scheme" content="light dark">
<script>try{var t=JSON.parse(localStorage.getItem('lrl:theme')||'null');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelector('meta[name=color-scheme]').content=t==='light'?'only light':'dark';}}catch(e){}</script>
<meta name="description" content="流日历：按你的出生信息，告诉你每天适合做什么、几点做、穿什么。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="流日历">
<title>流日历 · 个人行动日历</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="主导航" hidden></nav>
<div id="layer"></div>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
